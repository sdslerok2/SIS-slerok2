<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2E5C">
  <meta name="description" content="Website resmi dan Sistem Informasi Sekolah SD Negeri Slerok 2, Kota Tegal.">
  <title>SIS SD Negeri Slerok 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="assets/logo.png">
</head>
<body>
  <!-- Layar awal (hanya tampil saat pertama kali tanpa cache) -->
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-logo"></div>
    <div class="boot-nama">SD Negeri Slerok 2</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <!-- ============ TATA LETAK 1: WEBSITE PUBLIK ============ -->
  <div id="pub" class="pub" hidden>
    <header class="pub-head">
      <div class="wrap pub-head-in">
        <a href="javascript:void(0)" class="brand" data-go="beranda" aria-label="Beranda SD Negeri Slerok 2">
          <span class="brand-logo"><img id="pubLogo" alt="Logo SD Negeri Slerok 2"></span>
          <span class="brand-txt"><b id="pubNama">SD Negeri Slerok 2</b><small id="pubKota">Kota Tegal</small></span>
        </a>
        <nav class="pub-nav" id="pubNav" aria-label="Menu website"></nav>
        <div class="pub-head-act">
          <button class="btn btn-secondary pill btn-sm" data-go="masuk" id="pubMasuk"><i data-lucide="log-in"></i><span>Masuk</span></button>
          <button class="btn btn-icon btn-ghost pub-burger" id="pubBurger" aria-label="Buka menu" aria-expanded="false"><i data-lucide="menu"></i></button>
        </div>
      </div>
    </header>
    <div class="pub-drawer" id="pubDrawer" hidden>
      <div class="pub-drawer-panel">
        <div class="pub-drawer-head"><b>Menu</b><button class="btn btn-icon btn-ghost" data-close-drawer aria-label="Tutup menu"><i data-lucide="x"></i></button></div>
        <nav id="pubNavM" aria-label="Menu website (ponsel)"></nav>
        <button class="btn btn-cta w100" data-go="masuk"><i data-lucide="log-in"></i>Masuk ke SIS</button>
      </div>
    </div>
    <main id="pubMain" class="pub-main" tabindex="-1"></main>
    <footer class="pub-foot" id="pubFoot"></footer>
  </div>

  <!-- ============ TATA LETAK 2: APLIKASI ADMINISTRASI ============ -->
  <div id="adm" class="adm" hidden>
    <aside class="side" id="side" aria-label="Menu aplikasi">
      <div class="side-brand">
        <span class="side-logo"><img id="admLogo" alt=""></span>
        <div class="side-brand-txt"><b>SIS Slerok 2</b><small id="admPeran">—</small></div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <button class="nav-i" data-act="ke-web"><i data-lucide="globe"></i><span>Lihat Website</span></button>
        <button class="nav-i nav-out" data-act="keluar"><i data-lucide="log-out"></i><span>Keluar</span></button>
      </div>
    </aside>
    <div class="side-dim" id="sideDim" hidden></div>
    <div class="adm-body">
      <header class="top">
        <button class="btn btn-icon btn-ghost" id="btnSide" aria-label="Buka/tutup menu"><i data-lucide="panel-left"></i></button>
        <div class="top-title"><small id="topCrumb">Utama</small><b id="topJudul">Dashboard</b></div>
        <div class="top-act">
          <span class="chip chip-ta" id="topTA" title="Tahun ajaran aktif"><i data-lucide="calendar-range"></i><span>—</span></span>
          <span class="sync" id="sync" title="Status sinkronisasi"><i data-lucide="cloud-check"></i></span>
          <button class="btn btn-icon btn-ghost" id="btnTema" aria-label="Ganti tema terang/gelap"><i data-lucide="moon"></i></button>
          <button class="btn btn-icon btn-ghost notif" id="btnNotif" aria-label="Notifikasi"><i data-lucide="bell"></i><em id="notifN" hidden>0</em></button>
          <button class="me" id="btnMe" aria-label="Profil saya"><span class="avatar" id="meAv">A</span><span class="me-txt"><b id="meNama">—</b><small id="meRole">—</small></span></button>
        </div>
      </header>
      <main id="admMain" class="adm-main" tabindex="-1"></main>
    </div>
  </div>

  <!-- ============ TATA LETAK 3: PORTAL SISWA & ORANG TUA ============ -->
  <div id="portal" class="portal" hidden>
    <header class="portal-head">
      <div class="wrap pub-head-in">
        <span class="brand"><span class="brand-logo"><img id="porLogo" alt="Logo SD Negeri Slerok 2"></span>
          <span class="brand-txt"><b>SD Negeri Slerok 2</b><small>Portal Siswa &amp; Wali</small></span></span>
        <div class="pub-head-act">
          <button class="btn btn-ghost btn-sm" data-act="ganti-sandi"><i data-lucide="key-round"></i><span class="hide-sm">Ganti Sandi</span></button>
          <button class="btn btn-ghost btn-sm txt-danger" data-act="keluar"><i data-lucide="log-out"></i><span class="hide-sm">Keluar</span></button>
        </div>
      </div>
    </header>
    <main id="porMain" class="wrap portal-main" tabindex="-1"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="polite"></div>
  <iframe id="printFrame" title="Cetak" aria-hidden="true" tabindex="-1"></iframe>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <!-- Urutan penting: konfigurasi → skema → router data → aplikasi -->
  <script src="js/config.js"></script>
  <script src="js/skema.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
